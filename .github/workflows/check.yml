name: Portal prüfen
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Playwright 1.56.1 unterstützt Ubuntu 24.04; ubuntu-latest kann auf eine neuere Distribution wechseln.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Schulungswerkzeuge prüfen
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq
          mkdir -p test-results
          python3 scripts/check-training-scripts.py
          find Fachberatung_Anleitungen/Test-_und_Schulungsserver -name '*.sh' -print0 | xargs -0 shellcheck --severity=error
          find Fachberatung_Anleitungen/Test-_und_Schulungsserver -name '*.sh' -print0 | xargs -0 shellcheck --format=json > test-results/training-shellcheck.json || true
      - name: Externe Links der Schulungsumgebungen
        run: python3 scripts/check-training-links.py
      - name: Echte Docker-Diensteprobe
        run: bash scripts/smoke-training-docker.sh
      - run: npm run docs:check
      - name: Browserwerkzeug nur für diesen Prüflauf
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Navigation und Darstellung im Browser
        run: |
          npm run docs:preview -- --host 127.0.0.1 --port 4173 > /tmp/fbm-preview.log 2>&1 &
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:4173/Schulungsunterlagen/ > /dev/null && break
            sleep 1
          done
          npm run docs:check-browser
      - name: Prüfbilder aufbewahren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-und-layout
          path: test-results
      - name: Zweiter Build ohne Unterpfad
        env:
          BASE: /
        run: |
          npm run docs:build
          npm run docs:check-built
      - name: Keine beiläufigen Paketänderungen
        run: git diff --exit-code -- package.json package-lock.json
